---
name: Update bigfix-relevance-analyzer playground

# Publishes the analyzer's split set (manifest.json, editor.js, glue.mjs, the
# analyzer.core*.wasm.gz modules and index.html) flat into files/analyzer/.
# The contract is tools/playground-wasm/SPLIT_ANALYZER.md in
# jgstew/bigfix-relevance-analyzer; the logic is in
# .github/scripts/update_analyzer.py. The old single-file playground page in
# files/ is frozen: this workflow no longer updates it.
#
# Keep this file name: the analyzer repo's release dispatches it by name.

on:
  schedule:
    # Weekly, Sundays at 05:17 UTC
    - cron: "17 5 * * 0"
  # Dry run when this workflow, its scripts or the frozen page change: runs
  # the tests (which pin the frozen page), unpacks a fake release into a temp
  # folder, and checks the real release, but never commits or pushes.
  pull_request:
    paths:
      - ".github/workflows/update-bigfix-relevance-analyzer-playground.yaml"
      - ".github/scripts/**"
      - "files/bigfix-relevance-analyzer-playground.html"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.24.0 (blank = latest release)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # Serialize pushes to master. PR dry runs get their own group so a queued
  # one cannot replace a pending release dispatch.
  group: update-playground-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # PRs test the proposed workflow against the PR merge ref
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'master' }}

      # Offline tests of the publish script against fake releases.
      - name: Test the publish script
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py" -v

      # No release has the split set zip yet, so exercise the same verify and
      # unpack commands on a fake release, into a temp folder (not the site).
      - name: Dry run on a fake release
        if: github.event_name == 'pull_request'
        run: |
          fake="$RUNNER_TEMP/fake"
          rm -rf "$fake"
          python3 -I .github/scripts/fake_release.py "$fake/dl" --version 0.0.0
          (cd "$fake/dl" && sha256sum -c --ignore-missing SHA256SUMS.txt)
          apply() {
            : > "$fake/out"
            GITHUB_OUTPUT="$fake/out" python3 -I .github/scripts/update_analyzer.py apply \
              --release-dir "$fake/dl" \
              --dest "$fake/site/analyzer" \
              --tag v0.0.0 \
              --work-dir "$fake/work"
            cat "$fake/out"
          }
          # First run publishes; a second run on the same release is a no-op.
          apply | grep -qx "status=updated" || { echo "::error::first run did not update"; exit 1; }
          apply | grep -qx "status=unchanged" || { echo "::error::second run was not a no-op"; exit 1; }
          ls -l "$fake/site/analyzer"

      # Fetch only the small checksum file first: a release without the split
      # set zip (every release up to v1.38.1), or without SHA256SUMS.txt at all
      # (v0.1.0 to v0.5.1), ends the job here, successfully.
      - name: Check whether the release has the split analyzer set
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag=""
          if [ -n "$VERSION" ]; then
            printf '%s' "$VERSION" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([.-]?[0-9A-Za-z.]+)?$' \
              || { echo "::error::bad version: $VERSION"; exit 1; }
            tag="v${VERSION#v}"
          fi
          # Resolve "latest" to a concrete tag once, so the checksum and the
          # zip below always come from the same release.
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo jgstew/bigfix-relevance-analyzer --json tagName -q .tagName)"
            [ -n "$tag" ] || { echo "::error::could not resolve latest release"; exit 1; }
          fi
          if [ -n "$VERSION" ]; then
            echo "Release to apply: $tag (requested)"
          else
            echo "Release to apply: $tag (latest)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          assets="$(gh release view "$tag" --repo jgstew/bigfix-relevance-analyzer \
            --json assets -q '.assets[].name')"
          if ! printf '%s\n' "$assets" | grep -qx 'SHA256SUMS.txt'; then
            echo "::notice::$tag has no SHA256SUMS.txt, so no split analyzer set; nothing to publish"
            echo "listed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf "$RUNNER_TEMP/dl"
          mkdir -p "$RUNNER_TEMP/dl"
          gh release download "$tag" \
            --repo jgstew/bigfix-relevance-analyzer \
            --dir "$RUNNER_TEMP/dl" \
            --pattern SHA256SUMS.txt
          python3 -I .github/scripts/update_analyzer.py listed "$RUNNER_TEMP/dl/SHA256SUMS.txt"

      - name: Download, verify and unpack the split analyzer set
        id: apply
        if: steps.check.outputs.listed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
          # The name `listed` found: bigfix-relevance-analyzer-web.zip, or
          # bigfix-relevance-analyzer-analyzer.zip for releases up to 1.39.0.
          ZIP: ${{ steps.check.outputs.zip }}
        run: |
          gh release download "$TAG" \
            --repo jgstew/bigfix-relevance-analyzer \
            --dir "$RUNNER_TEMP/dl" \
            --pattern "$ZIP"
          (cd "$RUNNER_TEMP/dl" && sha256sum -c --ignore-missing SHA256SUMS.txt)
          # Verifies again, checks every entry and the manifest, and leaves
          # files/analyzer/ untouched on any error or if nothing changed.
          python3 -I .github/scripts/update_analyzer.py apply \
            --release-dir "$RUNNER_TEMP/dl" \
            --dest files/analyzer \
            --tag "$TAG" \
            --work-dir "$RUNNER_TEMP/work"

      - name: Commit and push if changed
        if: steps.apply.outputs.status == 'updated'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          d=files/analyzer
          if [ -z "$(git status --porcelain -- "$d")" ]; then
            echo "already up to date"; exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "dry run (pull_request): would commit this change, not pushing"
            git status --short -- "$d"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$d"
          git commit -m "Update bigfix-relevance-analyzer split analyzer set to $TAG"
          git push
